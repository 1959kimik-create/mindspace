<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>MindSpace — 마인드스페이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="app">
    <header class="header glass">
      <h1 class="logo">MindSpace</h1>
      <div class="header-actions">
        <label class="sr-only" for="themeSelect">시간대 테마 선택</label>
        <select id="themeSelect" class="theme-select">
          <option value="auto">자동 (기기 시간)</option>
          <option value="morning">아침</option>
          <option value="day">낮</option>
          <option value="evening">저녁</option>
          <option value="night">밤</option>
          <option value="dawn">새벽</option>
        </select>
        <button type="button" id="calendarBtn" class="calendar-btn" aria-expanded="false" aria-controls="calendarPanel">
          달력 보기
        </button>
      </div>
    </header>

    <main class="main" id="mainView">
      <section class="hero glass">
        <p class="greeting" id="greeting">오늘 하루도 수고 많으셨습니다.</p>
        <p class="timer" id="timerDisplay" aria-live="polite">10:00</p>
        <div class="duration-options" role="group" aria-label="명상 시간">
          <button type="button" class="chip" data-minutes="3">3분</button>
          <button type="button" class="chip" data-minutes="5">5분</button>
          <button type="button" class="chip is-active" data-minutes="10">10분</button>
          <button type="button" class="chip" data-minutes="15">15분</button>
          <button type="button" class="chip" data-minutes="0">자율</button>
        </div>
        <div class="timer-actions">
          <button type="button" id="startBtn" class="primary-btn">명상 시작</button>
          <button type="button" id="resetBtn" class="ghost-btn" hidden>리셋</button>
        </div>
      </section>

      <section class="player-wrap glass" id="playerWrap" hidden>
        <div class="player-head">
          <p class="player-title" id="playerTitle">명상 음악</p>
          <button type="button" id="closePlayerBtn" class="icon-btn" aria-label="플레이어 닫기">닫기</button>
        </div>
        <div class="player-frame">
          <iframe
            id="ytPlayer"
            title="명상 영상"
            src=""
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>

      <section class="categories">
        <h2 class="section-title">추천 명상 음악 카테고리</h2>
        <div class="category-grid">
          <button type="button" class="category-card glass" data-video="TSsEbovNtFE" data-title="수면 명상">
            <span class="category-icon" aria-hidden="true">🌙</span>
            <span class="category-name">수면 명상</span>
            <span class="category-desc">밤에 내리는 빗소리</span>
          </button>
          <button type="button" class="category-card glass" data-video="inpok4MKVLM" data-title="집중 명상">
            <span class="category-icon" aria-hidden="true">🧘</span>
            <span class="category-name">집중 명상</span>
            <span class="category-desc">어디서나 할 수 있는 마인드풀니스</span>
          </button>
          <button type="button" class="category-card glass" data-video="nNrgnVk_lkQ" data-title="휴식">
            <span class="category-icon" aria-hidden="true">🌿</span>
            <span class="category-name">휴식</span>
            <span class="category-desc">뇌파를 안정시키는 힐링 BGM</span>
          </button>
          <button type="button" class="category-card glass" data-video="j8I4sp1TSHQ" data-title="자연의 소리">
            <span class="category-icon" aria-hidden="true">🌊</span>
            <span class="category-name">자연의 소리</span>
            <span class="category-desc">음악 없이, 실제 파도 소리만</span>
          </button>
        </div>
      </section>
    </main>

    <aside class="calendar-panel glass" id="calendarPanel" hidden>
      <div class="calendar-head">
        <button type="button" id="prevMonthBtn" class="icon-btn" aria-label="이전 달">‹</button>
        <h2 class="calendar-title" id="calendarTitle">2026년 9월</h2>
        <button type="button" id="nextMonthBtn" class="icon-btn" aria-label="다음 달">›</button>
      </div>
      <div class="weekday-row" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <p class="day-detail" id="dayDetail">날짜를 누르면 그날의 명상 시간을 볼 수 있습니다.</p>
      <p class="storage-note">브라우저 쿠키/방문 기록 삭제 시 기록이 초기화될 수 있습니다</p>
      <button type="button" id="closeCalendarBtn" class="ghost-btn calendar-close">명상으로 돌아가기</button>
    </aside>

    <footer class="credit" id="photoCredit"></footer>
  </div>

  <div class="modal-backdrop" id="completeModal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <p class="modal-kicker">MindSpace</p>
      <h2 id="modalTitle">오늘의 명상 완료!</h2>
      <p class="modal-body" id="modalBody">10분 명상을 마쳤습니다. 오늘의 기록이 달력에 남았습니다.</p>
      <button type="button" id="modalConfirmBtn" class="primary-btn">확인</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
